name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (pinned lockfile)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Bundle check (iOS export)
        run: npx expo export --platform ios --output-dir /tmp/export
        env:
          CI: '1'

      - name: Dependency audit
        run: npm audit --audit-level=high
